@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f1e6d4; --surface:#fbf5ec; --surface-2:#eadbc4; --line:#d6c2a6; --line-strong:#8f7964;
  --fg:#2a1b14; --muted:#6c5545; --amber:#94541d; --amber-ink:#fff8ee;
  --crimson:#a3283d; --on-crimson:#ffffff; --ok:#4c7537; --busy:#9a8877; --scrim:rgba(42,27,20,.55); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f1e6d4; --surface:#fbf5ec; --surface-2:#eadbc4; --line:#d6c2a6; --line-strong:#8f7964;
  --fg:#2a1b14; --muted:#6c5545; --amber:#94541d; --amber-ink:#fff8ee;
  --crimson:#a3283d; --on-crimson:#ffffff; --ok:#4c7537; --busy:#9a8877; --scrim:rgba(42,27,20,.55); color-scheme:light}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.script{font-family:var(--f-display);font-weight:400;letter-spacing:-.015em;line-height:1}
.t-script{display:none!important}
.section-head h1,.band h1,.sheet-head h2,.mode h3,.ptitle{font-family:var(--f-display);font-weight:400;letter-spacing:-.015em;line-height:1.02}
.section-head h1,.band h1{display:grid;justify-items:start}
.t-main{display:block}
.t-script{display:block;color:var(--amber);font-size:.5em;letter-spacing:0;margin:-.12em 0 0 .9em;transform:rotate(-4deg);transform-origin:left center;padding-right:.2em}
.ptitle{font-size:24px;font-weight:700;letter-spacing:0}
.font-pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:18px}
.font-pick .chip{font-size:22px;padding:4px 14px;line-height:1.2}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fig{font-family:var(--f-fig);font-weight:400;letter-spacing:-.01em;font-variant-numeric:tabular-nums lining-nums}

/* Shell */
.shell{min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:flex-end;gap:12px;min-height:56px;box-sizing:border-box;
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--fg);cursor:pointer;min-height:44px;padding:0 8px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.menu-btn svg{width:22px;height:22px}
main{min-width:0;padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:28px}
.wrap>*,.section-head>*{min-width:0}
.rail{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;display:flex;align-items:center;gap:4px;padding:6px;max-width:calc(100vw - 24px);box-sizing:border-box;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);
  transform:translate(-50%,calc(100% + 40px));visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.rail.open{transform:translate(-50%,0);visibility:visible;transition:transform .25s ease,visibility 0s}
.rail-head,.rail .foot{display:none}
.rail nav{display:flex;gap:4px}
.rail .tab{display:grid;justify-items:center;align-content:center;gap:4px;min-width:76px;min-height:56px;padding:8px 10px;border-radius:10px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:12px;letter-spacing:.02em}
.rail .tab svg{width:21px;height:21px}
.rail .tab:hover{background:var(--surface-2);color:var(--fg)}
.rail .tab[aria-current="page"]{background:var(--surface-2);color:var(--amber)}
.menu-scrim{position:fixed;inset:0;z-index:45;background:var(--scrim)}
.menu-fab{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:44;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:0 10px 30px rgba(0,0,0,.22);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.menu-fab svg{width:20px;height:20px}
.menu-fab[hidden],.menu-scrim[hidden]{display:none}
.edge{display:none;position:fixed;left:0;right:0;bottom:0;height:28px;z-index:44;background:none;border:0;padding:0;cursor:pointer}
.edge::after{content:"";position:absolute;left:50%;bottom:9px;width:72px;height:4px;margin-left:-36px;border-radius:2px;background:var(--line-strong);opacity:.8;transition:opacity .2s,background .2s}
.edge:hover::after,.edge:focus-visible::after{background:var(--amber);opacity:1}
@media (hover:hover) and (pointer:fine) and (min-width:900px){
  .topbar{display:none}
  .edge{display:block}
  .menu-fab{display:none}
  main{padding-block:40px 72px}
}
@media not all and (hover:hover) and (pointer:fine) and (min-width:900px){
  .menu-fab{top:calc(6px + env(safe-area-inset-top,0px));bottom:auto;left:max(12px,env(safe-area-inset-left,0px));transform:none;min-height:44px;padding:0 18px;z-index:31;box-shadow:0 4px 14px rgba(0,0,0,.12)}
  .rail{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;left:max(12px,env(safe-area-inset-left,0px));transform:translateY(calc(-100% - 40px))}
  .rail.open{transform:none}
  main{padding-block:20px 48px}
  .teacher-bar{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.rail,.rail.open{transition:none}}

/* Common */
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.section-head h1{font-size:clamp(40px,7vw,64px)}
.section-head p{color:var(--muted);max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:2px;padding:11px 20px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;line-height:1.2}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}

/* Method */

.stage-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.stage-bar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 var(--r) var(--r);overflow:hidden;background:color-mix(in srgb,var(--line) 70%,transparent)}

}

var EVT={feriado:{l:'Feriado',c:'var(--busy)'},recital:{l:'Recital',c:'var(--crimson)'},ferias:{l:'Férias',c:'var(--ok)'},reposicao:{l:'Reposição',c:'var(--amber)'},evento:{l:'Evento',c:'var(--fg)'}};
var WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var WDL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var MONTHS_L=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function pad(n){return (n<10?'0':'')+n}
function isoOf(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function todayIso(){var t=new Date();return isoOf(t.getFullYear(),t.getMonth(),t.getDate())}
function addDays(iso,n){var p=iso.split('-');var dt=new Date(+p[0],+p[1]-1,+p[2]+n);return isoOf(dt.getFullYear(),dt.getMonth(),dt.getDate())}
function longDate(iso){var p=iso.split('-');var dt=new Date(+p[0],+p[1]-1,+p[2]);return WDL[dt.getDay()]+', '+(+p[2])+' de '+MONTHS_L[+p[1]-1].toLowerCase()}
function evList(){return (D.events||[]).filter(function(e){return !ui.calType||e.type===ui.calType})}
function eventsOn(iso){return evList().filter(function(e){return e.date<=iso&&iso<=(e.end||e.date)}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'')})}
(function(){var t=todayIso();if(t<'2027-01-01'){ui.calY=2027;ui.calM=0}else{var n=new Date();ui.calY=n.getFullYear();ui.calM=n.getMonth()}ui.calSel=null;ui.calType=''})();
function gcalLink(e){
 var dates;
 if(!e.time){dates=e.date.replace(/-/g,'')+'/'+addDays(e.end||e.date,1).replace(/-/g,'')}
 else{var d=e.date.replace(/-/g,'');var st=e.time.replace(':','');var et=(e.endTime||(pad(Math.min(23,+e.time.slice(0,2)+1))+e.time.slice(2))).replace(':','');dates=d+'T'+st+'00/'+d+'T'+et+'00'}
 var det=(e.desc?e.desc+'\n\n':'')+'Aulas de música · Rafael Fagundes';
 return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+dates+'&details='+encodeURIComponent(det)+(e.place?'&location='+encodeURIComponent(e.place):'')+'&ctz=America%2FSao_Paulo';
}
function evItem(e,ed){
 var t=EVT[e.type]||EVT.evento;
 var when=e.end&&e.end!==e.date?'Até '+longDate(e.end).toLowerCase():'';
 return '<div class="cal-ev" style="--ev:'+t.c+'"><div style="display:grid;gap:3px;min-width:0"><div class="song-sub"><span class="ev-tag">'+t.l+'</span>'+(e.time?'<span class="fig" style="font-size:16px;color:var(--fg)">'+esc(e.time)+(e.endTime?'–'+esc(e.endTime):'')+'</span>':'<span>Dia inteiro</span>')+(when?'<span>'+esc(when)+'</span>':'')+'</div><strong class="ev-title">'+esc(e.title)+'</strong>'+(e.place?'<span class="muted" style="font-size:13.5px">'+esc(e.place)+'</span>':'')+(e.desc?'<span class="muted" style="font-size:13.5px">'+esc(e.desc)+'</span>':'')+'</div>'+
 '<div class="actions"><a class="btn small" target="_blank" rel="noopener noreferrer" href="'+gcalLink(e)+'">'+gIcon()+'Salvar no Google Agenda'+GO+'</a>'+(ed?'<button class="btn small danger" data-del-event="'+e.id+'">Remover</button>':'')+'</div></div>';
}
var GO='<span class="go" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>';
function gIcon(){return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>'}
function daysUntil(iso){var t=todayIso().split('-'),d=iso.split('-');return Math.round((new Date(+d[0],+d[1]-1,+d[2])-new Date(+t[0],+t[1]-1,+t[2]))/86400000)}
function whenLabel(e){var a=daysUntil(e.date),b=daysUntil(e.end||e.date);if(a<=0&&b>=0)return a===0&&b===0?'Hoje':'Acontecendo agora';if(a===1)return 'Amanhã';if(a<60)return 'Em '+a+' dias';var m=Math.round(a/30);return 'Em '+m+' meses'}
function upcoming(){var t=todayIso();return (D.events||[]).filter(function(e){return (e.type==='recital'||e.type==='ferias')&&(e.end||e.date)>=t}).sort(function(a,b){return a.date.localeCompare(b.date)})}
function remRow(e,ed){
 var t=EVT[e.type]||EVT.evento;var f=fmtDate(e.date);var f2=e.end&&e.end!==e.date?fmtDate(e.end):null;
 return '<li class="rem" style="--ev:'+t.c+'"><span class="rem-d"><span class="fig">'+esc(f.d)+'</span><span>'+esc(f.m)+'</span></span>'+
 '<span class="rem-b"><span class="rem-t">'+esc(e.title)+'</span><span class="rem-m">'+(f2?'<span>até '+esc(f2.d)+' '+esc(f2.m)+'</span>':'')+(e.time?'<span>'+esc(e.time)+(e.endTime?'–'+esc(e.endTime):'')+'</span>':'')+(e.place?'<span>'+esc(e.place)+'</span>':'')+'</span>'+(e.desc?'<span class="rem-desc">'+esc(e.desc)+'</span>':'')+'</span>'+
 '<span class="rem-a"><span class="rem-when">'+whenLabel(e)+'</span><a class="btn small" target="_blank" rel="noopener noreferrer" href="'+gcalLink(e)+'" aria-label="Lembrar '+esc(e.title)+' no Google Agenda">'+gIcon()+'Lembrar no Google'+GO+'</a>'+(ed?'<button class="btn small danger" data-del-event="'+e.id+'">Remover</button>':'')+'</span></li>';
}

 return '<section style="display:grid;gap:16px">'+
 '<div class="section-head"><div><h1 style="font-size:clamp(30px,6vw,52px)"><span class="t-main">'+TX('dates.title','Datas importantes')+'</span></h1></div></div>'+

function vCalendar(){
 var ed=editing();var y=ui.calY,m=ui.calM;
 var first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),prevDim=new Date(y,m,0).getDate();
 var today=todayIso();var cells='';var total=Math.ceil((first+dim)/7)*7;
 for(var i=0;i<total;i++){
  var dn,iso,out=false;
  if(i<first){dn=prevDim-first+1+i;var pm=m===0?11:m-1,py=m===0?y-1:y;iso=isoOf(py,pm,dn);out=true}
  else if(i>=first+dim){dn=i-first-dim+1;var nm=m===11?0:m+1,ny=m===11?y+1:y;iso=isoOf(ny,nm,dn);out=true}
  else{dn=i-first+1;iso=isoOf(y,m,dn)}
  var evs=eventsOn(iso);
  var cls='cal-day'+(out?' out':'')+(iso===today?' today':'')+(iso===ui.calSel?' sel':'')+(i%7===0||i%7===6?' wkd':'')+(evs.length?' has':'');
  cells+='<button class="'+cls+'" data-cal-day="'+iso+'" aria-label="'+longDate(iso)+(evs.length?', '+evs.length+' data'+(evs.length>1?'s':''):'')+'"'+(iso===ui.calSel?' aria-pressed="true"':'')+'><span class="cal-n">'+dn+'</span>'+
   (evs.length?'<span class="cal-evs">'+evs.slice(0,2).map(function(e){var t=EVT[e.type]||EVT.evento;return '<span class="cal-bar" style="--ev:'+t.c+'">'+esc(e.title)+'</span>'}).join('')+(evs.length>2?'<span class="cal-more">+'+(evs.length-2)+'</span>':'')+'</span><span class="cal-dots">'+evs.slice(0,3).map(function(e){return '<i style="--ev:'+(EVT[e.type]||EVT.evento).c+'"></i>'}).join('')+'</span>':'')+'</button>';
 }
 var side;
 if(ui.calSel){
  var se=eventsOn(ui.calSel);
  side='<div class="cal-side-head"><div><div class="eyebrow">Dia selecionado</div><h3 class="ptitle" style="font-size:24px">'+longDate(ui.calSel)+'</h3></div><button class="x" data-cal-clear aria-label="Voltar para próximas datas">×</button></div>'+
   (se.length?se.map(function(e){return evItem(e,ed)}).join(''):'<p class="muted">Nenhuma data marcada neste dia.</p>');
 }else{
  var from=today<'2027-01-01'?'2027-01-01':today;
  var up=evList().filter(function(e){return (e.end||e.date)>=from}).sort(function(a,b){return a.date.localeCompare(b.date)}).slice(0,5);
  side='<div class="cal-side-head"><div><div class="eyebrow">A partir de '+(from==='2027-01-01'?'janeiro de 2027':'hoje')+'</div><h3 class="ptitle" style="font-size:24px">Próximas datas</h3></div></div>'+
   (up.length?up.map(function(e){var f=fmtDate(e.date);return '<button class="cal-up" data-cal-go="'+e.date+'"><span class="fig cal-up-d">'+esc(f.d)+'<small>'+esc(f.m)+'</small></span><span style="display:grid;gap:2px;min-width:0;text-align:left"><span>'+esc(e.title)+'</span><span class="muted" style="font-size:12.5px">'+(EVT[e.type]||EVT.evento).l+(e.time?' · '+esc(e.time):'')+'</span></span></button>'}).join(''):'<p class="muted">Nenhuma data '+(ui.calType?'deste tipo ':'')+'a partir daqui.</p>');
 }
 var form=ed?'<form id="f-event" class="panel" style="display:grid;gap:14px"><div class="edit-flag">Nova data'+(ui.calSel?' · '+longDate(ui.calSel):'')+'</div><div class="form-grid">'+
  '<label class="full">Título<input name="title" id="ne-title" required placeholder="Ex.: Recital de meio de ano"></label>'+
  '<label>Data<input type="date" name="date" id="ne-date" required value="'+(ui.calSel||isoOf(y,m,1))+'"></label>'+
  '<label>Até (opcional)<input type="date" name="end" id="ne-end"></label>'+
  '<label>Tipo<select name="type" id="ne-type">'+Object.keys(EVT).filter(function(k){return k!=='feriado'}).concat(['feriado']).map(function(k){return '<option value="'+k+'">'+EVT[k].l+'</option>'}).join('')+'</select></label>'+
  '<label>Início (opcional)<input type="time" name="time" id="ne-time"></label>'+
  '<label>Término (opcional)<input type="time" name="endTime" id="ne-endtime"></label>'+
  '<label>Local (opcional)<input name="place" id="ne-place" placeholder="Ex.: Auditório da escola"></label>'+
  '<label class="full">Descrição (opcional)<input name="desc" id="ne-desc"></label>'+
  '</div><div class="actions"><button class="btn primary" type="submit">Adicionar data</button></div><p class="muted" style="font-size:13px">Depois de adicionar, toque em “Salvar no Google Agenda” na data para colocá-la também na sua agenda.</p></form>':'';
 var sub=ed?'<div class="panel" style="display:grid;gap:10px"><div class="edit-flag">Agenda pública no Google (opcional)</div><label>Link para os alunos seguirem uma agenda sua de datas<input id="cal-url" data-cal-url type="url" value="'+esc(D.calendarUrl||'')+'" placeholder="https://calendar.google.com/calendar/u/0?cid=…"></label><p class="muted" style="font-size:13px">No Google Agenda, crie uma agenda só para as datas das aulas, deixe-a pública e cole aqui o link de compartilhamento. Aparece para os alunos o botão “Seguir agenda no Google”.</p></div>':'';
 return '<section style="display:grid;gap:16px">'+
 '<div class="section-head"><div><h1 style="font-size:clamp(38px,7vw,64px)"><span class="t-main">Calendário</span><span class="t-script">de 2027</span></h1></div>'+
 '<p>Feriados, recitais, férias e reposições. Toque em uma data para ver os detalhes e salvar no seu Google Agenda.'+(D.calendarUrl&&/^https:\/\/calendar\.google\.com\//.test(D.calendarUrl)?'</p><a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(D.calendarUrl)+'">'+gIcon()+'Seguir agenda no Google'+GO+'</a>':'</p>')+'</div>'+
 '<div class="chips scroll">'+[''].concat(Object.keys(EVT)).map(function(k){return '<button class="chip" data-cal-type="'+k+'" aria-pressed="'+(ui.calType===k)+'">'+(k?'<span class="dot" style="background:'+EVT[k].c+'"></span>'+EVT[k].l:'Todas')+'</button>'}).join('')+'</div>'+
 '<div class="cal-wrap"><div class="cal panel"><div class="cal-head"><button class="btn small ghost" data-cal-nav="-1" aria-label="Mês anterior">‹</button><h3><span class="ptitle" style="font-size:26px">'+MONTHS_L[m]+'</span> <span class="fig muted" style="font-size:22px">'+y+'</span></h3><button class="btn small ghost" data-cal-nav="1" aria-label="Próximo mês">›</button></div>'+
 '<div class="cal-grid cal-wd">'+WD.map(function(w){return '<span>'+w+'</span>'}).join('')+'</div><div class="cal-grid">'+cells+'</div>'+
 '<div class="cal-foot"><button class="linkish" data-cal-today>'+(today<'2027-01-01'?'Ir para janeiro de 2027':'Ir para hoje')+'</button><span class="muted" style="font-size:12.5px">Feriados importados do Google Agenda (Feriados no Brasil)</span></div></div>'+
 '<div class="cal-side panel">'+side+'</div></div>'+sub+form+'</section>';
}

function vAgenda(){
 var ed=editing();

function filteredSongs(){
 var q=norm(ui.q);
 return D.songs.filter(function(s){
  if(ui.fInstr&&s.instr.indexOf(ui.fInstr)<0)return false;
  if(ui.fLevel&&s.level!==ui.fLevel)return false;
  if(ui.fSrc==='sugestao'&&s.source!=='sugestao')return false;
  if(ui.fSrc==='acervo'&&s.source==='sugestao')return false;
  if(ui.mine&&!study[s.id])return false;
  if(q&&norm(s.title+' '+s.composer+' '+s.style+' '+s.instr.join(' ')).indexOf(q)<0)return false;
  return true;
 }).sort(function(a,b){return a.level-b.level||a.title.localeCompare(b.title,'pt')});
}

/* ---------- publish ---------- */
function buildDoc(data){
 var SC='<'+'/script>';
 var json=JSON.stringify(data).replace(/</g,'\\u003c');
 var head=['app-title','app-meta','app-fonts','app-style'].map(function(id){var el=document.getElementById(id);return el?el.outerHTML:''}).join('');
 var code=document.getElementById('app-script').textContent;
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+head+'<div id="app"></div><script type="application/json" id="app-data">'+json+SC+'<script id="app-script">'+code+SC+'</body></html>';
}
function findPersonal(){
 var own=String((D.contact&&D.contact.whatsapp)||'').replace(/\D/g,'').slice(-8);
 var reE=/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/,reP=/(?:\+?55\s?)?(?:\(?\d{2}\)?\s?)?9?\s?\d{4}[\s.-]?\d{4}/g;
 var hits=[];
 function chk(where,txt){txt=String(txt||'');if(!txt)return;if(reE.test(txt)){hits.push(where+': “'+txt.slice(0,60)+'”');return}var m=txt.match(reP)||[];for(var i=0;i<m.length;i++){var dg=m[i].replace(/\D/g,'');if(dg.length>=8&&dg.slice(-8)!==own){hits.push(where+': “'+txt.slice(0,60)+'”');return}}}
 Object.keys(D.texts||{}).forEach(function(k){chk('Texto',D.texts[k])});
 (D.events||[]).forEach(function(e){chk('Data '+e.date,e.title);chk('Data '+e.date,e.desc);chk('Data '+e.date,e.place)});
 (D.prices||[]).forEach(function(p){chk('Valor',p.name)});chk('Valores',D.pricesNote);
 return hits;
}
function publish(){
 if(!ART||ui.publishing)return;
 var hits=findPersonal();
 if(hits.length){ui.sheet={type:'privacy',hits:hits};render();return}
 ui.publishing=true;render();stash();
 Promise.resolve().then(function(){return ART.publish(buildDoc(D))}).then(function(){
  SAVED=clone(D);sDel('sessionStorage','rf-draft');ui.publishing=false;toast('Alterações publicadas. Os alunos já veem a nova versão.');
 },function(err){
  ui.publishing=false;var c=err&&err.code;
  if(c==='not_writer'||c==='not_granted'){ui.teacher=false;ui.edit=false;toast('Esta visualização é somente leitura.')}
  else if(c==='conflict'){toast('Uma versão mais nova foi publicada. Recarregando com suas alterações guardadas…')}
  else if(c==='rate_limited'){toast('Muitas publicações seguidas. Aguarde um minuto e publique de novo.')}
  else toast('Não foi possível publicar agora. Tente novamente em instantes.');
 });
}

/* ---------- capabilities ---------- */
function initCaps(){
 if(!window.claude||typeof window.claude.use!=='function')return false;
 var cl=window.claude;
 Promise.all([cl.use('user').catch(function(){return null}),cl.use('artifact').catch(function(){return null})]).then(function(r){
  var u=r[0];ART=r[1];if(!ART||!u)return;
  return Promise.all([u.canEdit().catch(function(){return false}),u.isOwner().catch(function(){return false})]).then(function(x){
   if(x[0]||x[1]){
    ui.teacher=true;
    var dr=sGet('sessionStorage','rf-draft');
    if(dr){try{var o=JSON.parse(dr);if(JSON.stringify(o)!==JSON.stringify(SAVED)){D=o;ui.edit=true;ui.toast='Suas alterações não publicadas foram restauradas.';setTimeout(function(){ui.toast='';render()},3600)}else sDel('sessionStorage','rf-draft')}catch(e){}}
    render();
   }
  });
 });
 return true;
}
render();
if(!initCaps()){window.addEventListener('load',function(){initCaps()})}
})();
